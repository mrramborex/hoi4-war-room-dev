name: Scan archival recordings for silent TOBS stations
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scout-silent-stations-c16.yml"
permissions:
  contents: write
jobs:
  archive-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scout source metadata for silent-station repertoires
        run: python3 music/scout_silent_stations_c16.py
      - name: Commit search research without publishing music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/phase-23c16-archive-scout.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.16: shortlist heritage music for silent stations"
            git push
          fi
