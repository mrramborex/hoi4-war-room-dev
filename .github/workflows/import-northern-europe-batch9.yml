name: Import authentic northern Europe recordings phase 23C15
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-northern-europe-batch9.yml"
permissions:
  contents: write
concurrency:
  group: tobs-23c15
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify twelve full historical LOC recordings
        run: python3 music/import_northern_europe_batch9.py
      - name: Add verified original masters to development only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-c15-*.mp3 audio-manifest.json music/northern-europe-batch9-verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.15: add twelve original northern European historical recordings"
            git push
          fi
