name: TOBS Bulk Archive Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official archive indexes
        run: |
          mkdir -p archive-discovery
          curl -fL --retry 2 --max-time 120 https://data.labs.loc.gov/jukebox/metadata.jsonl -o /tmp/metadata.jsonl
          curl -fL --retry 2 --max-time 120 https://data.labs.loc.gov/jukebox/manifest.json -o /tmp/manifest.json
      - name: Extract regional candidates
        run: |
          python3 - <<'PY'
          import json,re,pathlib,collections
          from urllib.parse import unquote
          out=pathlib.Path("archive-discovery")
          manifest=json.load(open("/tmp/manifest.json"))
          def objects(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from objects(v)
              elif isinstance(x,list):
                  for v in x: yield from objects(v)
          def ids(x):
              return set(re.findall(r'jukebox[-/](\d+)',unquote(str(x)),re.I))
          index=collections.defaultdict(set)
          # Extract IDs from the actual audio URL, not its enclosing object.
          def strings(x):
              if isinstance(x,str): yield x
              elif isinstance(x,dict):
                  for k,v in x.items():
                      yield k
                      yield from strings(v)
              elif isinstance(x,list):
                  for v in x: yield from strings(v)
          for u in strings(manifest):
              m=re.fullmatch(r'https://data\.labs\.loc\.gov/jukebox/audio/jukebox-(\d+)_\d+\.mp3',u)
              if m: index[m.group(1)].add(u)
          print("Audio index sample:",list(index.items())[:3])
          if not index: print("Raw manifest strings sample:",list(strings(manifest))[:30])
          current=json.load(open("audio-manifest.json"))["stations"]
          prior={t["src"] for a in current.values() for t in a}
          used=ids(list(prior))
          # Local archive filenames also carry numeric identifiers.
          for u in prior:
              m=re.search(r'-(\d+)\.mp3$',u)
              if m: used.add(m.group(1))
          regions={"Bulgaria":"bulgarian|bulgaria","Romania":"romanian|roumanian|rumanian|romania","Estonia":"estonian|estonia","Latvia":"latvian|lettish|latvia","Lithuania":"lithuanian|lithuania","Iceland":"icelandic|iceland","Finland":"finnish|finland","Denmark":"danish|denmark","Yugoslavia":"serbian|croatian|slovenian|serbia|croatia|slovenia","Soviet Union":"russian|ukrainian|russia|ukraine","Belgium":"belgian|belgium","Switzerland":"swiss|switzerland","Portugal":"portuguese|portugal","Italy":"italian|italy"}
          results={k:[] for k in regions}
          counters=collections.Counter()
          sample=json.loads(next(iter(open("/tmp/metadata.jsonl"))))
          (out/"schema.json").write_text(json.dumps({"metadata_sample":sample,"manifest_sample":list(strings(manifest))[:30],"audio_index_sample":{k:sorted(v) for k,v in list(index.items())[:10]}},ensure_ascii=False,indent=2))
          for line in open("/tmp/metadata.jsonl"):
              if not line.strip(): continue
              r=json.loads(line)
              take=str(r.get('Recording_take_id',''))
              matchids={take} if take.isdigit() else ids(r.get('Id',''))
              counters["records"]+=1
              if matchids: counters["with_ids"]+=1
              if matchids & index.keys(): counters["joined"]+=1
              if not matchids or matchids & used: continue
              links=sorted({u for i in matchids for u in index[i]}-prior)
              if not links: continue
              normalized={re.sub(r"[^a-z0-9]","",k.lower()):v for k,v in r.items()}
              fields={k:normalized.get(re.sub(r"[^a-z0-9]","",k.lower())) for k in ("Title","Language","Genre","Subjects","Description","Audio_type","Contributors","Date","Rights","Url","Country","Subject","Contributor","Languages","Location") }
              evidence=" ".join(str(fields[k]) for k in ("Language","Languages","Genre","Subjects","Subject","Description","Title"))
              if re.search(r'spoken word|monologue|recitation|speech',str(fields["Audio_type"]),re.I): continue
              for station,pattern in regions.items():
                  if re.search(r'\b(?:'+pattern+r')\b',evidence,re.I):
                      results[station].append({"archive_ids":sorted(matchids),"audio_urls":links,"metadata":fields,"review":"Verify musical origin, performer, duplicate status and playback before integration"})
          print("Join diagnostics:",dict(counters),"indexed IDs:",len(index))
          for k,v in results.items(): print(k,len(v),"candidates")
          (out/"candidates.json").write_text(json.dumps(results,ensure_ascii=False,indent=2))
          (out/"summary.json").write_text(json.dumps({"indexed_ids":len(index),"counts":{k:len(v) for k,v in results.items()}},indent=2))
          if not index or not counters["joined"]: raise RuntimeError("No archive join; inspect schema artifact")
          if not any(results.values()): raise RuntimeError("No regional matches; inspect metadata schema artifact")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tobs-bulk-discovery
          path: archive-discovery/
