name: Import full-length LOC recordings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-loc-full.yml"
permissions:
  contents: write
concurrency:
  group: loc-full-audio-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and checksum-verify five official full recordings
        run: python3 music/import_loc_full.py
      - name: Replace excerpts in dev repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch audio/tobs-loc-*.wav
          git add audio/tobs-full-*.mp3 audio-manifest.json
          if git diff --cached --quiet; then
            echo "Nothing to change"
          else
            git commit -m "Phase 23C: replace short LOC samples with five complete historic recordings"
            git push
          fi
