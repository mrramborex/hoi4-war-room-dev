name: Import nine minor nation historical recordings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-minor-batch4.yml"
permissions:
  contents: write
concurrency:
  group: tobs-minors-batch4
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate nine LOC source file checksums
        run: python3 music/import_minor_batch4.py
      - name: Commit verified music to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-minors-batch4-*.mp3 audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.10: authentic Scandinavia Mexico and Poland records"
            git push
          fi
