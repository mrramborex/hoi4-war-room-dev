name: Research major-power LOC recordings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scout-loc-major-powers.yml"
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research LOC language-matched historical recordings
        run: python3 music/scout_loc_major_powers.py
      - name: Commit rights-scoped source shortlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/major-power-loc-scout.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C: shortlist full-length LOC historic international recordings"
            git push
          fi
