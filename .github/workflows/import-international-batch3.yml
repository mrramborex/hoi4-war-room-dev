name: Import verified international historic recordings batch 3
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-international-batch3.yml"
permissions:
  contents: write
concurrency:
  group: tobs-international-batch3
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify three LOC original sound recordings
        run: python3 music/import_international_batch3.py
      - name: Commit archive music only to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-international-batch3-*.mp3 audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.9: add real French German and Austrian historic performances"
            git push
          fi
