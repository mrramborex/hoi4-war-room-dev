name: TOBS Archival Recording Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify archival candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, subprocess, tempfile, pathlib, hashlib, time
          candidates = [
              ("Semper Fidelis", "jukebox-654077"),
              ("Stars and Stripes Forever", "jukebox-117907"),
              ("National Emblem March", "jukebox-134787"),
              ("America the Beautiful", "jukebox-33730"),
              ("Auld Lang Syne", "jukebox-647677"),
              ("Over There", "jukebox-656848"),
              ("Over There - alternate", "jukebox-658069"),
              ("Over There - Billy Murray", "ihas.100010567"),
          ]
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"TOBS archival research/1.0 (hoi4warroom.com)"})
              with urllib.request.urlopen(req, timeout=60) as f:
                  return json.load(f)
          def urls(obj):
              if isinstance(obj, dict):
                  for v in obj.values(): yield from urls(v)
              elif isinstance(obj, list):
                  for v in obj: yield from urls(v)
              elif isinstance(obj, str) and obj.startswith("https://") and urllib.parse.urlsplit(obj).path.lower().endswith((".mp3",".ogg",".oga",".wav",".flac",".m4a")):
                  yield obj
          manifest = json.load(open("audio-manifest.json"))
          existing = {t["src"] for tracks in manifest["stations"].values() for t in tracks}
          local_hashes = {}
          for src in existing:
              if src.startswith("audio/") and pathlib.Path(src).is_file():
                  local_hashes[hashlib.sha256(pathlib.Path(src).read_bytes()).hexdigest()] = src
          rows = []
          pathlib.Path("archive-report").mkdir(exist_ok=True)
          for title, ident in candidates:
              row = {"candidate":title,"archive_id":ident,"status":"error","rights_review":"manual review required"}
              try:
                  data = get("https://www.loc.gov/item/"+ident+"/?fo=json")
                  pathlib.Path("archive-report",ident+".json").write_text(json.dumps(data,indent=2))
                  item = data.get("item",{})
                  row["metadata"] = {k:item.get(k) for k in ("title","date","dates","contributors","contributor_names","rights","rights_advisory","rights_and_access","notes")}
                  links = list(dict.fromkeys(urls(data.get("resources",[]))))
                  row["audio_candidates"] = links
                  for url in links[:8]:
                      if not (urllib.parse.urlsplit(url).hostname or "").endswith(".loc.gov"): continue
                      try:
                          with tempfile.TemporaryDirectory() as tmp:
                              p = pathlib.Path(tmp,"audio")
                              subprocess.run(["curl","-fLsS","--retry","2","--max-time","120","--max-filesize","100000000","-o",str(p),url],check=True,capture_output=True,timeout=300)
                              probe = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(p)],timeout=60))
                              if not any(s.get("codec_type")=="audio" for s in probe.get("streams",[])): raise ValueError("no audio stream")
                              subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(p),"-map","0:a:0","-f","null","-"],check=True,capture_output=True,timeout=120)
                              digest = hashlib.sha256(p.read_bytes()).hexdigest()
                              row.update(status="decoded",audio_url=url,duration=probe["format"].get("duration"),sha256=digest,existing_url=url in existing,local_duplicate=local_hashes.get(digest))
                              break
                      except Exception as e:
                          row.setdefault("audio_errors",[]).append(str(e))
                  if row["status"]!="decoded": row["detail"]="No verified direct audio endpoint"
              except Exception as e:
                  row["detail"]=str(e)
              rows.append(row)
              print(json.dumps(row),flush=True)
              time.sleep(3)
          for row in rows:
              row["candidate_duplicate_ids"]=[r["archive_id"] for r in rows if r is not row and row.get("sha256") and r.get("sha256")==row["sha256"]]
          pathlib.Path("archive-report/results.json").write_text(json.dumps(rows,indent=2))
          print("Decoded:",sum(r["status"]=="decoded" for r in rows),"/",len(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tobs-archival-verification
          path: archive-report/
