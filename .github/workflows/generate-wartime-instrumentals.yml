name: Generate original TOBS wartime instrumentals
# Rebuild six extended full-length originals for the dev radio.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-wartime-instrumentals.yml"
permissions:
  contents: write
concurrency:
  group: tobs-original-wartime-instrumentals
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical audio synthesis dependency
        run: python3 -m pip install numpy
      - name: Compose and synthesize six entirely original instrumentals
        run: python3 music/generate_wartime_instrumentals.py
      - name: Commit original WAV files to development radio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-original-*.wav audio-manifest.json
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Phase 23C.5: original WWII-period-themed radio instrumentals"
            git push
          fi
