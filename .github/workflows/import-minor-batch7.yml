name: Import original minor-nation recordings batch 7
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-minor-batch7.yml"
permissions:
  contents: write
concurrency:
  group: tobs-minor-batch7
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original LOC files against archived MD5
        run: python3 music/import_minor_batch7.py
      - name: Commit verified music only to development
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-c13-*.mp3 audio-manifest.json music/minor-batch7-verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.13: archive-recorded Allied medley tango and Mexican band music"
            git push
          fi
