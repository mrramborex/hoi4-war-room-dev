name: Import verified minor nations batch 5
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-minor-batch5.yml"
permissions:
  contents: write
concurrency:
  group: tobs-minor-batch5
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify LOC original master SHA and MD5
        run: python3 music/import_minor_batch5.py
      - name: Commit public-domain tracks to development only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-c11-*.mp3 audio-manifest.json music/minor-batch5-verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Phase 23C.11: authentic original Argentine Brazilian Greek and Mexican recordings"
            git push
          fi
