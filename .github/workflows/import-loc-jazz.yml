name: Import verified LOC Jazz excerpts
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-loc-jazz.yml"
permissions:
  contents: write
concurrency:
  group: loc-jazz-audio-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and validate exactly five curated LOC samples
        run: python3 music/import_loc_jazz.py
      - name: Commit verified audio to development repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tobs-loc-*.wav audio-manifest.json
          if git diff --cached --quiet; then
            echo "Audio already imported; nothing to commit."
          else
            git commit -m "Phase 23C.2: add five verified LOC Citizen DJ Jazz excerpts"
            git push
          fi
